name: Build ZhishiKebiao Rust Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust Unit Tests & Build Native .so
        working-directory: rust-core
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ] && [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/$(ls -1 ${ANDROID_HOME}/ndk | sort -V | tail -n 1)"
          fi
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cargo test
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZhishiKebiao-3.3.0-Rust-APK
          path: app/build/outputs/apk/release/app-release.apk
