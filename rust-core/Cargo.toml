[package]
name = "zhishi_core"
version = "3.3.0"
edition = "2021"

[lib]
name = "zhishi_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
