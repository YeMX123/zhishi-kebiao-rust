<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<script>
// Native AndroidBridge -> HB compatibility shim (enables native file chooser, 3-mode widget, custom widget bg, portal import)
(function(){
  if (!window.AndroidBridge) return;
  window.HB = window.HB || {};
  window.HB.Storage = {
    getStorageSync: function(o){ return { data: window.AndroidBridge.getStorage(o && o.key ? o.key : '') }; },
    setStorageSync: function(o){ window.AndroidBridge.setStorage(o && o.key ? o.key : '', o && o.value != null ? String(o.value) : ''); }
  };
  window.HB.Interface = {
    navigateTo: function(o){ window.AndroidBridge.openPage(o.url || '', (o.topBar && o.topBar.title) || '知时课表', (o.topBar && o.topBar.backgroundColor) || '#0b1224', (o.topBar && o.topBar.titleColor) || '#f8fafc'); },
    navigateBack: function(){ window.AndroidBridge.closePage(); },
    navigateToCourse: function(o){ window.AndroidBridge.openPortal(o.url || '', o.initJs || ''); },
    triggerWidgetAutoUpdate: function(){ window.AndroidBridge.refreshWidgets(); },
    setNightModeSync: function(o){ window.AndroidBridge.setStatusBar(!!(o && o.nightMode)); },
    setNightMode: function(o){ window.AndroidBridge.setStatusBar(!!(o && o.nightMode)); }
  };
  window.HB.Device = {
    getClipboardData: function(o){ var t = window.AndroidBridge.getClipboard(); if (o && o.success) o.success({ data: t }); }
  };
})();
</script>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>个性化背景 · 知时课表</title>
<style>
:root {
  --bg-mesh: radial-gradient(circle at 18% 12%, #172554 0%, #0b1224 52%, #070b16 100%);
  --glass: rgba(15, 23, 42, 0.72);
  --glass-border: rgba(255, 255, 255, 0.14);
  --glass-highlight: rgba(255, 255, 255, 0.08);
  --pill: rgba(255, 255, 255, 0.08);
  --text-1: #f8fafc; --text-2: #94a3b8; --text-3: #64748b;
  --accent: #3b82f6; --danger: #f87171;
}
[data-theme="light"] {
  --bg-mesh: linear-gradient(160deg, #eef3fb 0%, #e1eaf8 100%);
  --glass: rgba(255, 255, 255, 0.80);
  --glass-border: rgba(15, 23, 42, 0.10);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --pill: rgba(15, 23, 42, 0.06);
  --text-1: #0f172a; --text-2: #475569; --text-3: #64748b;
  --accent: #2563eb; --danger: #dc2626;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg-mesh); color: var(--text-1);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
}
.page {
  max-width: 520px; margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
}
.card {
  background: var(--glass); border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 18px; padding: 14px; margin-bottom: 12px;
}
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  padding: 4px; border-radius: 13px; background: var(--pill);
}
.seg button {
  padding: 8px 4px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.seg button.active { background: var(--accent); color: #fff; }
.ratio-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
}
.ratio-chip {
  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--glass-border);
  background: var(--pill); color: var(--text-2); font-size: 11.5px; font-weight: 600; cursor: pointer;
}
.ratio-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.crop-stage {
  position: relative; width: 100%; height: 320px; margin-top: 10px;
  border-radius: 14px; overflow: hidden; background: rgba(0, 0, 0, 0.36);
  border: 1px solid var(--glass-border);
  touch-action: none; user-select: none;
  display: flex; align-items: center; justify-content: center;
}
.crop-frame {
  position: relative; overflow: hidden;
  border: 1.5px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52);
  border-radius: 8px;
}
.crop-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 50%;
  transform-origin: center center; pointer-events: none;
  display: none;
}
.crop-dim {
  position: absolute; inset: 0; pointer-events: none;
  background: rgba(7, 11, 22, 0.38);
}
.crop-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px);
  background-size: 33.333% 33.333%;
}
.gif-badge {
  position: absolute; top: 8px; left: 8px; z-index: 4;
  padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  background: rgba(59, 130, 246, 0.88); color: #fff; display: none;
}
.crop-empty {
  position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  color: var(--text-2); font-size: 13px; text-align: center; padding: 16px;
  pointer-events: none;
}
.ctrl-row {
  display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--text-2);
}
.ctrl-row label { width: 66px; flex-shrink: 0; font-weight: 600; }
.ctrl-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.ctrl-val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-1); font-weight: 600; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  flex: 1; padding: 11px 10px; border-radius: 12px; border: none;
  font-size: 13.5px; font-weight: 700; cursor: pointer;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--pill); color: var(--text-1); border: 1px solid var(--glass-border); }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.28); }
.note { font-size: 11.5px; color: var(--text-2); line-height: 1.55; margin-top: 8px; }
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  padding: 9px 16px; border-radius: 999px; background: rgba(15, 23, 42, 0.94);
  color: #fff; font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease; z-index: 99; max-width: 88vw; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="seg">
      <button id="tApp" class="active" onclick="setTarget('app')">软件背景</button>
      <button id="tWidget" onclick="setTarget('widget')">小组件背景</button>
      <button id="tBoth" onclick="setTarget('both')">同时修改</button>
    </div>

    <div class="ratio-row">
      <button class="ratio-chip active" data-r="auto" onclick="setRatio('auto')">自适应比例</button>
      <button class="ratio-chip" data-r="phone" onclick="setRatio('phone')">手机竖屏 9:19</button>
      <button class="ratio-chip" data-r="w42" onclick="setRatio('w42')">宽屏小组件 2:1</button>
      <button class="ratio-chip" data-r="w22" onclick="setRatio('w22')">方形小组件 1:1</button>
      <button class="ratio-chip" data-r="orig" onclick="setRatio('orig')">原图比例</button>
    </div>

    <div class="crop-stage" id="cropStage">
      <div class="crop-frame" id="cropFrame">
        <img class="crop-img" id="cropImg" alt="preview"/>
        <div class="crop-dim" id="cropDim"></div>
        <div class="crop-grid"></div>
      </div>
      <span class="gif-badge" id="gifBadge">GIF 动态背景</span>
      <div class="crop-empty" id="cropEmpty">
        <div style="font-size:14px;font-weight:700;color:var(--text-1)">支持 JPG / PNG / GIF 动态图</div>
        <div>点击下方「从相册选图」开始自定义取景与裁剪</div>
      </div>
    </div>

    <div class="ctrl-row">
      <label>画面缩放</label>
      <input type="range" id="zoomRange" min="100" max="280" value="100" oninput="onSliderChange()"/>
      <span class="ctrl-val" id="zoomVal">1.0×</span>
    </div>
    <div class="ctrl-row">
      <label>背景暗度</label>
      <input type="range" id="dimRange" min="0" max="75" value="38" oninput="onSliderChange()"/>
      <span class="ctrl-val" id="dimVal">38%</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="pickFromGallery()">🖼 从相册选图</button>
      <button class="btn btn-secondary" onclick="pickFileDirect()">📁 选文件/GIF</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveAndApply()">✓ 保存并立即应用</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="resetPosition()">居中适配</button>
      <button class="btn btn-danger" onclick="clearCurrentBg()">恢复默认背景</button>
    </div>
    <input type="file" id="fileInput" accept="image/*,.gif" style="display:none" onchange="onFilePicked(this)"/>

    <div class="note">
      支持静态图片与 <b>GIF 动态图</b>（单指拖动调整取景位置，滑块调整缩放与暗度）。软件背景保存后返回即刻生效；如需选原版动态 GIF，优先点「选文件/GIF」可避免系统相册压缩动图。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var THEME_KEY = 'cs_theme_v1';
  var APP_BG_CFG_KEY = 'zs_app_bg_cfg_v2';
  var WIDGET_BG_CFG_KEY = 'zs_widget_bg_cfg_v2';

  try {
    var t = localStorage.getItem(THEME_KEY) || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}

  var target = 'app';
  var ratioMode = 'auto';
  var currentSrc = '';
  var isGif = false;
  var naturalW = 0, naturalH = 0;
  var posX = 50, posY = 50; // percentage 0..100
  var zoom = 1.0;
  var dimPct = 38;
  var dragging = false, lastX = 0, lastY = 0;

  var stage = document.getElementById('cropStage');
  var frame = document.getElementById('cropFrame');
  var imgEl = document.getElementById('cropImg');
  var dimEl = document.getElementById('cropDim');
  var emptyEl = document.getElementById('cropEmpty');
  var gifBadge = document.getElementById('gifBadge');
  var toastTimer = null;

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function storageGet(key) {
    try {
      if (window.HB && window.HB.Storage && typeof window.HB.Storage.getStorageSync === 'function') {
        var r = window.HB.Storage.getStorageSync({ key: key });
        if (typeof r === 'string' && r) return r;
        if (r && r.data) return r.data;
      }
    } catch (e) {}
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  function storageSet(key, val) {
    try {
      if (window.HB && window.HB.Storage && typeof window.HB.Storage.setStorageSync === 'function') {
        window.HB.Storage.setStorageSync({ key: key, value: val });
      }
    } catch (e) {}
    try {
      if (val) localStorage.setItem(key, val);
      else localStorage.removeItem(key);
    } catch (e) {}
  }

  function getCropAspect() {
    if (ratioMode === 'phone') return 9 / 19.5;
    if (ratioMode === 'w42') return 2.0;
    if (ratioMode === 'w22') return 1.0;
    if (ratioMode === 'orig' && naturalW > 0 && naturalH > 0) return naturalW / naturalH;
    if (target === 'widget') return 2.0;
    var sw = window.screen ? window.screen.width : window.innerWidth;
    var sh = window.screen ? window.screen.height : window.innerHeight;
    if (sw > 0 && sh > 0) return Math.min(0.75, Math.max(0.42, sw / sh));
    return 9 / 19.5;
  }

  function layoutFrame() {
    var cw = stage.clientWidth || 320;
    var ch = stage.clientHeight || 320;
    var ar = getCropAspect();
    var pad = 16;
    var maxW = cw - pad * 2, maxH = ch - pad * 2;
    var w = maxW, h = w / ar;
    if (h > maxH) { h = maxH; w = h * ar; }
    frame.style.width = Math.round(w) + 'px';
    frame.style.height = Math.round(h) + 'px';
    imgEl.style.objectPosition = posX.toFixed(1) + '% ' + posY.toFixed(1) + '%';
    imgEl.style.transform = 'scale(' + zoom.toFixed(2) + ')';
    dimEl.style.background = 'rgba(7, 11, 22, ' + (dimPct / 100).toFixed(2) + ')';
    emptyEl.style.display = currentSrc ? 'none' : 'flex';
    imgEl.style.display = currentSrc ? 'block' : 'none';
    gifBadge.style.display = (currentSrc && isGif) ? 'inline-block' : 'none';
  }

  function setPreviewSrc(src, forceGif) {
    if (!src) return;
    currentSrc = src;
    isGif = !!forceGif || /\.gif(\?|$)/i.test(src) || src.indexOf('data:image/gif') === 0;
    imgEl.onload = function () {
      naturalW = imgEl.naturalWidth || 0;
      naturalH = imgEl.naturalHeight || 0;
      layoutFrame();
    };
    imgEl.onerror = function () {
      showToast('图片读取失败，请尝试点「选文件/GIF」');
    };
    imgEl.src = src;
    layoutFrame();
  }

  function extractUriFromHB(res) {
    if (!res) return '';
    if (typeof res === 'string') return res;
    if (res.compressUri) return res.compressUri;
    if (res.uri) return res.uri;
    if (res.path) return res.path;
    if (res.data) {
      if (typeof res.data === 'string') return res.data;
      if (res.data.compressUri) return res.data.compressUri;
      if (res.data.uri) return res.data.uri;
      if (res.data.path) return res.data.path;
      if (Array.isArray(res.data) && res.data[0]) return extractUriFromHB(res.data[0]);
    }
    if (Array.isArray(res) && res[0]) return extractUriFromHB(res[0]);
    return '';
  }

  window.pickFromGallery = function () {
    try {
      if (window.HB && window.HB.Photo && typeof window.HB.Photo.selectImages === 'function') {
        window.HB.Photo.selectImages({
          count: 1,
          success: function (res) {
            var uri = extractUriFromHB(res);
            if (uri) {
              var src = (uri.indexOf('file://') === 0 || uri.indexOf('data:') === 0 || uri.indexOf('content://') === 0 || uri.indexOf('http') === 0) ? uri : ('file://' + uri);
              posX = 50; posY = 50; zoom = 1;
              document.getElementById('zoomRange').value = 100;
              document.getElementById('zoomVal').textContent = '1.0×';
              setPreviewSrc(src, /\.gif(\?|$)/i.test(uri));
              showToast('已加载图片，可拖动调整取景后点保存');
              return;
            }
            document.getElementById('fileInput').click();
          },
          fail: function () {
            document.getElementById('fileInput').click();
          }
        });
        return;
      }
    } catch (e) {}
    document.getElementById('fileInput').click();
  };

  window.pickFileDirect = function () {
    var inp = document.getElementById('fileInput');
    inp.value = '';
    inp.click();
  };

  window.onFilePicked = function (inp) {
    var file = inp.files && inp.files[0];
    if (!file) return;
    var fileIsGif = (file.type === 'image/gif') || /\.gif$/i.test(file.name || '');
    if (fileIsGif && file.size > 4.5 * 1024 * 1024) {
      showToast('GIF 动图超过 4.5MB，可能保存较慢，建议选更轻量的动图');
    }
    var reader = new FileReader();
    reader.onload = function (ev) {
      posX = 50; posY = 50; zoom = 1;
      document.getElementById('zoomRange').value = 100;
      document.getElementById('zoomVal').textContent = '1.0×';
      setPreviewSrc(ev.target.result, fileIsGif);
      showToast(fileIsGif ? '已加载 GIF 动态背景，拖动可调整构图' : '已加载图片，可拖动调整取景后点保存');
    };
    reader.readAsDataURL(file);
  };

  window.setTarget = function (t) {
    target = t;
    document.getElementById('tApp').classList.toggle('active', t === 'app');
    document.getElementById('tWidget').classList.toggle('active', t === 'widget');
    document.getElementById('tBoth').classList.toggle('active', t === 'both');
    layoutFrame();
  };

  window.setRatio = function (r) {
    ratioMode = r;
    var btns = document.querySelectorAll('.ratio-chip');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-r') === r);
    layoutFrame();
  };

  window.onSliderChange = function () {
    zoom = (Number(document.getElementById('zoomRange').value) || 100) / 100;
    dimPct = Number(document.getElementById('dimRange').value) || 0;
    document.getElementById('zoomVal').textContent = zoom.toFixed(1) + '×';
    document.getElementById('dimVal').textContent = dimPct + '%';
    layoutFrame();
  };

  window.resetPosition = function () {
    posX = 50; posY = 50; zoom = 1;
    document.getElementById('zoomRange').value = 100;
    document.getElementById('zoomVal').textContent = '1.0×';
    layoutFrame();
  };

  function tryCompressStaticImage(src) {
    // Keep GIFs untouched so animation plays natively!
    if (isGif || !src) return src;
    // If file:// URI, keep it directly (fast, zero taint error, zero base64 bloat)
    if (src.indexOf('file://') === 0 || src.indexOf('content://') === 0) return src;
    // If large data:image/* from file input, downscale gently to <= 1280px JPEG so storage never overflows
    if (src.indexOf('data:image/') === 0 && src.length > 550000 && imgEl.naturalWidth > 0) {
      try {
        var maxSide = 1280;
        var w = imgEl.naturalWidth, h = imgEl.naturalHeight;
        var sc = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext('2d').drawImage(imgEl, 0, 0, c.width, c.height);
        return c.toDataURL('image/jpeg', 0.84);
      } catch (e) { return src; }
    }
    return src;
  }

  window.saveAndApply = function () {
    if (!currentSrc) { showToast('请先选择一张图片或 GIF'); return; }
    var finalSrc = tryCompressStaticImage(currentSrc);
    var cfg = JSON.stringify({
      src: finalSrc,
      isGif: isGif,
      posX: Math.round(posX),
      posY: Math.round(posY),
      zoom: Number(zoom.toFixed(2)),
      dim: dimPct
    });
    if (target === 'app' || target === 'both') storageSet(APP_BG_CFG_KEY, cfg);
    if (target === 'widget' || target === 'both') storageSet(WIDGET_BG_CFG_KEY, cfg);
    showToast(target === 'app' ? '软件背景已保存，正在应用...' : (target === 'both' ? '已同时保存软件与小组件背景' : '已保存小组件背景配置'));
    setTimeout(goBack, 450);
  };

  window.clearCurrentBg = function () {
    if (target === 'app' || target === 'both') {
      storageSet(APP_BG_CFG_KEY, '');
      storageSet('zs_app_bg_v1', '');
    }
    if (target === 'widget' || target === 'both') {
      storageSet(WIDGET_BG_CFG_KEY, '');
      storageSet('zs_widget_bg_v1', '');
    }
    currentSrc = ''; isGif = false; imgEl.src = '';
    layoutFrame();
    showToast('已恢复默认深海磨砂背景');
    setTimeout(goBack, 450);
  };

  window.goBack = function () {
    try {
      if (window.HB && window.HB.Interface && typeof window.HB.Interface.navigateBack === 'function') {
        window.HB.Interface.navigateBack({});
        return;
      }
    } catch (e) {}
    window.history.back();
  };

  // Drag to pan object-position smoothly
  stage.addEventListener('touchstart', function (e) {
    if (!currentSrc || e.touches.length !== 1) return;
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchmove', function (e) {
    if (!dragging || !currentSrc || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - lastX;
    var dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    posX = Math.max(0, Math.min(100, posX - dx * 0.35));
    posY = Math.max(0, Math.min(100, posY - dy * 0.35));
    layoutFrame();
  }, { passive: true });
  stage.addEventListener('touchend', function () { dragging = false; }, { passive: true });

  // Restore saved config if any
  var savedRaw = storageGet(APP_BG_CFG_KEY);
  if (savedRaw) {
    try {
      var parsed = JSON.parse(savedRaw);
      if (parsed && parsed.src) {
        posX = typeof parsed.posX === 'number' ? parsed.posX : 50;
        posY = typeof parsed.posY === 'number' ? parsed.posY : 50;
        zoom = typeof parsed.zoom === 'number' ? parsed.zoom : 1;
        dimPct = typeof parsed.dim === 'number' ? parsed.dim : 38;
        document.getElementById('zoomRange').value = Math.round(zoom * 100);
        document.getElementById('zoomVal').textContent = zoom.toFixed(1) + '×';
        document.getElementById('dimRange').value = dimPct;
        document.getElementById('dimVal').textContent = dimPct + '%';
        setPreviewSrc(parsed.src, parsed.isGif);
      }
    } catch (e) {}
  }
  layoutFrame();
  window.addEventListener('resize', layoutFrame);
})();
</script>
</body>
</html>
